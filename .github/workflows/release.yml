name: Release

# A pushed v* tag builds the binaries and publishes the GitHub release; the
# tag's message becomes the release notes. workflow_dispatch is a dry run:
# it builds and uploads workflow artifacts and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read-only by default; only the publish job may write (and attest).
permissions:
  contents: read

# One release run per ref at a time; never cancel one halfway through.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # A release builds from scratch: no cache another run could have written.
          cache: false

      - name: Resolve version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "${REF_TYPE}" = tag ]; then
            # checkout can leave an annotated tag as a bare ref; refetch the
            # real tag object so its type (and message) are visible.
            git fetch --force origin "refs/tags/${REF_NAME}:refs/tags/${REF_NAME}"
            if [ "$(git cat-file -t "refs/tags/${REF_NAME}")" != tag ]; then
              echo "::error::${REF_NAME} is not an annotated tag; recreate it with 'git tag -s ${REF_NAME}'"
              exit 1
            fi
            VERSION="${REF_NAME#v}"
          else
            VERSION="0.0.0-dryrun.$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Vet, test, build
        run: make vet test build

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist/completions
          for sh in bash zsh fish; do
            ./bin/shelp completion "${sh}" > "dist/completions/shelp.${sh}"
          done
          for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="shelp_${VERSION}_${os}_${arch}"
            stage="dist/${name}"
            mkdir -p "${stage}/completions"
            CGO_ENABLED=0 GOOS="${os}" GOARCH="${arch}" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "${stage}/shelp" ./cmd/shelp
            cp LICENSE README.md "${stage}/"
            cp dist/completions/shelp.* "${stage}/completions/"
            tar -C "${stage}" -czf "dist/${name}.tar.gz" shelp LICENSE README.md completions
            rm -rf "${stage}"
          done
          rm -rf dist/completions
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)
          ls -l dist
          cat dist/checksums.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish the GitHub release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Build provenance: `gh attestation verify <file> -R EricAndrechek/shelp`.
    permissions:
      contents: write      # create and publish the release
      id-token: write      # sign the provenance attestation (Sigstore)
      attestations: write  # store it with the repository
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish the release
        run: |
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" != tag ]; then
            echo "::error::${TAG} is not an annotated tag"
            exit 1
          fi
          VERSION="${TAG#v}"
          # Releases are immutable once published, so upload everything to a
          # draft first and publish it last.
          gh release create "${TAG}" --draft --verify-tag --notes-from-tag \
            --title "shelp ${VERSION}" dist/*.tar.gz dist/checksums.txt
          gh release edit "${TAG}" --draft=false --latest

  homebrew-tap:
    name: Homebrew tap
    needs: publish
    uses: ./.github/workflows/homebrew-tap.yml
    secrets:
      HOMEBREW_TAP_TRIGGER_TOKEN: ${{ secrets.HOMEBREW_TAP_TRIGGER_TOKEN }}
